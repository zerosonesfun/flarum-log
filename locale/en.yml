# Drink Log – English
# Root key must match the extension ID from Extension::nameToId() (vendor/core).
# nameToId() does: explode('/', name) then str_replace(['flarum-ext-','flarum-'], '', package).
# So zerosonesfun/flarum-log → package "log" → id zerosonesfun-log (not zerosonesfun-flarum-log).

zerosonesfun-log:
  admin:
    button_label_label: Button label
    button_label_help: "Text for the drinking button. Use {count} as placeholder for the number (e.g. \"{count} Drinking\")."
    cooldown_minutes_label: Cooldown (minutes)
    cooldown_minutes_help: "How many minutes before a user can click again (1–1440)."
    log_tag_slug_label: Log tag slug
    log_tag_slug_help: "Tag slug to attach to new \"Log - date\" discussions when the Tags extension is enabled. Leave empty to skip auto-tagging."
    variety_autocomplete_list_label: Variety autocomplete list
    variety_autocomplete_list_help: "Comma-separated words or phrases to suggest after \"variety\" in log discussion composer body (e.g. strong, mild, light). Leave empty to disable."
  forum:
    drinking_button: '{count} Drinking'
    cooldown_message: You can only add to the live count every {minutes} minutes.
    user_card_drink: '1 drink'
    user_card_drinks: '{count} drinks'
    drink_logs_nav: 'Drink Logs ({count})'
    drink_logs_nav_label: Drink Logs
    drink_logs_requires_tags: Drink Logs require the Tags extension and a configured Log tag.

# Fallback in case any context uses composer-style id (no flarum- strip)
zerosonesfun-flarum-log:
  admin:
    button_label_label: Button label
    button_label_help: "Text for the drinking button. Use {count} as placeholder for the number (e.g. \"{count} Drinking\")."
